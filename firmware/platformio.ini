[platformio]
src_dir = wifimodem

[env]
framework = arduino
monitor_speed = 1200

; Phase 1: Telnet-only modem on a Wemos D1 mini (ESP8266).
[env:esp8266]
platform = espressif8266
board = d1_mini

; Phase 2: Telnet + SSH modem on an ESP32 DevKit.
[env:esp32]
platform = espressif32
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = -DRETROSSH_SSH=1
lib_deps = ewpa/LibSSH-ESP32
